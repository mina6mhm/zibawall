// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        // آینه‌ی ایرانی مایکت — اول این رو امتحان می‌کنه، چون dl.google.com معمولاً
        // بدون فیلترشکن در دسترس نیست. اگه این هم جواب نداد، google() و mavenCentral()
        // به‌عنوان fallback همچنان امتحان می‌شن.
        maven { url 'https://maven.myket.ir' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"
subprojects {
    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'

            // @capacitor/browser (استفاده‌شده برای باز کردن لینک درگاه زرین‌پال) از نسخه‌ی
            // جدیدش androidx.browser:1.9.0 رو می‌کشه که نیاز به compileSdk 36 و AGP 8.9.1+
            // داره. اینجا صراحتاً قفلش می‌کنیم رو همون نسخه‌ی قدیمی‌تر (که با
            // compileSdk 35 سازگاره و توی variables.gradle هم ست شده)، تا هیچ
            // مسیر transitive-ای نتونه نسخه‌ی جدیدترو بکشه بالا.
            force 'androidx.browser:browser:1.8.0'
        }
    }
}

allprojects {
    repositories {
        maven { url 'https://maven.myket.ir' }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
