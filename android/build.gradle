// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"
subprojects {
    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'

            // @capacitor/browser (استفاده‌شده برای باز کردن لینک درگاه زرین‌پال) از نسخه‌ی
            // جدیدش androidx.browser:1.9.0 رو می‌کشه که نیاز به compileSdk 36 و AGP 8.9.1+
            // داره. با قفل کردن این نسخه‌ی قدیمی‌تر (که با compileSdk 35 سازگاره)، دیگه
            // نیازی به آپدیت AGP نداریم و به همون تنظیمات پایدار دیروز برمی‌گردیم.
            force 'androidx.browser:browser:1.8.0'
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}