ext {
    minSdkVersion = 23
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'

    // @capacitor/browser (برای باز کردن لینک درگاه زرین‌پال) به‌صورت پیش‌فرض
    // androidx.browser:1.9.0 رو می‌کشه که نیاز به compileSdk 36 و AGP 8.9.1+
    // داره — همون چیزی که دیشب کل بیلد رو خراب کرد. با ست کردن همین
    // نسخه‌ی قدیمی‌تر (که capacitor-browser از رو همین ext می‌خونتش)،
    // دیگه نیازی به آپدیت compileSdk/AGP/Gradle نیست و به همون تنظیمات
    // پایدار قبلی برمی‌گردیم.
    androidxBrowserVersion = '1.8.0'
}
